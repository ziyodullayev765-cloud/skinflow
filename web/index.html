<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0c0f" />
    <meta name="description" content="SkinFlow — open virtual cases and build your collection of original skins. Entertainment only, no real money." />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/assets/icons/app.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" as="image" href="/assets/cases/neon.svg" />
    <title>SkinFlow</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      html,body{background:#0b0c0f;margin:0}
      #boot{position:fixed;inset:0;display:grid;place-items:center}
      #boot i{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#8b9bff,#5ce1e6);opacity:.85;animation:b 1.1s ease-in-out infinite}
      @keyframes b{50%{transform:scale(.86);opacity:.45}}
      @media (prefers-reduced-motion: reduce){#boot i{animation:none}}
    </style>
  </head>
  <body>
    <div id="root"><div id="boot" aria-label="Loading"><i></i></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
